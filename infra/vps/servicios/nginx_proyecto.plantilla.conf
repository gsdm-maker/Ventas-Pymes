# API de un proyecto por subdominio. Va en /etc/nginx/sites-available/<proyecto>.
# Reemplazar: __P__ (proyecto), __DOMINIO__, __ORIGEN__ (origen exacto de la app),
# __REST__, __ADMIN__, __AUTH__, __STORAGE__, __FN__ (puertos en loopback).
# Certbot agrega el bloque TLS y la redirección a HTTPS.
# GoTrue debe tener GOTRUE_RATE_LIMIT_HEADER=X-Real-IP.

limit_req_zone $binary_remote_addr zone=__P___login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=__P___api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=__P___fn:10m rate=60r/m;

map $http_origin $__P___cors {
    default "";
    "__ORIGEN__" "__ORIGEN__";
}

# Encabezados solo para preflight: nginx omite los que quedan vacíos.
map $request_method $__P___cors_metodos {
    default "";
    OPTIONS "GET, POST, PUT, PATCH, DELETE, OPTIONS";
}
map $request_method $__P___cors_headers {
    default "";
    OPTIONS "authorization, apikey, content-type, prefer, range, accept-profile, content-profile, x-client-info, x-supabase-api-version, x-upsert, cache-control";
}
map $request_method $__P___cors_max_age {
    default "";
    OPTIONS "600";
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    client_max_body_size 3m;
    limit_req_status 429;
    server_tokens off;

    # Se sobrescriben siempre: nunca se confía en lo que manda el cliente.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 30s;

    # El único CORS es el de nginx.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Expose-Headers;

    add_header Access-Control-Allow-Origin $__P___cors always;
    add_header Access-Control-Expose-Headers "Content-Range, X-Total-Count" always;
    add_header Vary "Origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Methods $__P___cors_metodos always;
    add_header Access-Control-Allow-Headers $__P___cors_headers always;
    add_header Access-Control-Max-Age $__P___cors_max_age always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location = /health {
        proxy_pass http://127.0.0.1:__ADMIN__/ready;
    }

    # La API admin de GoTrue solo se usa desde el servidor, por loopback.
    location ^~ /auth/v1/admin {
        return 403;
    }

    location ~ ^/auth/v1/(token|recover|otp)$ {
        limit_req zone=__P___login burst=20 nodelay;
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:__AUTH__;
    }

    location /auth/v1/ {
        limit_req zone=__P___api burst=40 nodelay;
        proxy_pass http://127.0.0.1:__AUTH__/;
    }

    location /rest/v1/ {
        limit_req zone=__P___api burst=40 nodelay;
        proxy_pass http://127.0.0.1:__REST__/;
    }

    location /storage/v1/ {
        limit_req zone=__P___api burst=40 nodelay;
        proxy_pass http://127.0.0.1:__STORAGE__/;
    }

    # Solo las funciones conocidas. El asistente puede tardar varias rondas con el modelo.
    location ~ ^/functions/v1/(admin-users|asistente|suscripcion)$ {
        limit_req zone=__P___fn burst=30 nodelay;
        client_max_body_size 64k;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:__FN__;
    }

    location / {
        return 404;
    }
}
