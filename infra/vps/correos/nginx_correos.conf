# Plantillas de correo de GoTrue. Va en /etc/nginx/sites-available/msp_correos (+ enlace en sites-enabled).
# La carpeta debe ser legible por nginx (no usar /srv/<proyecto>, que es solo de root): /srv/correos_msp, 755.
server {
    listen 127.0.0.1:8099;
    server_name _;
    root /srv/correos_msp;
    access_log off;
    server_tokens off;
    location ~ \.html$ { try_files $uri =404; }
    location / { return 404; }
}
