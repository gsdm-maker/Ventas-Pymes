# Plantillas de correo de GoTrue de un proyecto. Va en /etc/nginx/sites-available/__P___correos (+ enlace en sites-enabled).
# Reemplazar: __P__ (proyecto).
# La carpeta debe ser legible por nginx (no usar /srv/__P__, que es solo de root): /srv/__P___correos, 755.
server {
    listen 127.0.0.1:8099;
    server_name _;
    root /srv/__P___correos;
    access_log off;
    server_tokens off;
    location ~ \.html$ { try_files $uri =404; }
    location / { return 404; }
}
