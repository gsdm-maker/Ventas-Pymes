<!doctype html>
<html lang="es">
<body style="margin:0;padding:24px;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#18181b">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:8px;padding:32px">
    <tr><td>
      <h2 style="margin:0 0 16px;font-size:20px">Confirma el cambio de correo</h2>
      <p style="margin:0 0 24px;font-size:15px;line-height:1.5">Pediste cambiar el correo de tu cuenta de {{ .Email }} a {{ .NewEmail }}.</p>
      <p style="margin:0"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:6px;font-size:15px">Confirmar cambio</a></p>
      <p style="margin:24px 0 0;font-size:12px;color:#71717a;line-height:1.5">Si no solicitaste este correo, puedes ignorarlo.</p>
    </td></tr>
  </table>
</body>
</html>
