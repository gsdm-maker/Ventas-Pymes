# Plantilla de pg_hba.conf para el cluster del VPS (Postgres 18, puerto 5433).
# Diseño: docs/DISENO_PLANTILLA_VPS.md (sección 5).
# Después de editar: sudo systemctl reload postgresql@18-main
#
# ANTES DE REEMPLAZAR las reglas "host all all" actuales:
#   1. Ver quién usa hoy el cluster (otras apps del VPS incluidas):
#        select distinct usename, datname, client_addr from pg_stat_activity where backend_type = 'client backend';
#      y revisar pg_hba_file_rules. Mientras el ambiente actual siga vivo, sus líneas se conservan
#      ARRIBA del bloque "reject", acotadas a su base y su rol.
#   2. Si los contenedores usan la red bridge de Docker, se conectan desde 172.x y no desde 127.0.0.1:
#      usar network_mode: host o agregar la subred del bridge en la línea del proyecto.
#
# TYPE  DATABASE      USER                                                        ADDRESS        METHOD

# Mantenimiento: solo el usuario del sistema postgres, por socket.
local   all           postgres                                                                   peer

# Un bloque por proyecto <p>: solo sus 3 roles con login, solo a su base, solo desde 127.0.0.1.
# host  <p>           <p>_authenticator,<p>_auth,<p>_storage                      127.0.0.1/32   scram-sha-256
# Ejemplo:
host    msp_prueba    msp_prueba_authenticator,msp_prueba_auth,msp_prueba_storage 127.0.0.1/32   scram-sha-256

# Todo lo demás se rechaza.
local   all           all                                                                        reject
host    all           all                                                         0.0.0.0/0      reject
host    all           all                                                         ::/0           reject
